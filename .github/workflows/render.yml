name: render

# Type-checks the engine, renders the sample scene in every style on a runner, checks that two
# renders agree within tolerance (export/determinism.mjs), and keeps the videos as an artifact.
# The runner has no GPU: Chrome draws in software, slower but the same code path.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: assets/emblems
          key: emblems-${{ hashFiles('assets/emblems/manifest.json') }}
      - run: npm ci
      - name: Emblems (pinned by hash in the manifest)
        run: python3 tools/data/fetch_emblems.py --sync
      - run: npx tsc --noEmit
      - name: Render the hook in every style
        run: node export/render.mjs --all-styles --workers 2
      - name: Render the whole video (22 s)
        run: node export/render.mjs --no-build --scene karadeniz-gemi --style A
      - name: Determinism
        run: node export/determinism.mjs A
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: videos
          path: out/*.mp4
          retention-days: 14
