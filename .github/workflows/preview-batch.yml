name: preview-batch

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Maximum style previews; variants may reuse a story, never alter its facts"
        type: number
        default: 20

permissions:
  contents: read

concurrency:
  group: preview-batch
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      NVAPI: ${{ secrets.NVAPI }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_TTS_LICENSE_ACCEPTED: ${{ vars.HF_TTS_LICENSE_ACCEPTED }}
      HF_TTS_REFERENCE_REPO: ${{ vars.HF_TTS_REFERENCE_REPO }}
      HF_TTS_REFERENCE_FILE: ${{ vars.HF_TTS_REFERENCE_FILE }}
      OMNIVOICE_SPACE: k2-fsa/OmniVoice
      OMNIVOICE_LANGUAGE: Turkish
      OMNIVOICE_INSTRUCT: ${{ vars.OMNIVOICE_INSTRUCT }}
      OMNIVOICE_STEPS: ${{ vars.OMNIVOICE_STEPS }}
      OMNIVOICE_GUIDANCE: ${{ vars.OMNIVOICE_GUIDANCE }}
      OMNIVOICE_SPEED: ${{ vars.OMNIVOICE_SPEED }}
      EDGE_TTS_VOICE: ${{ vars.EDGE_TTS_VOICE }}
      PREVIEW_COUNT: ${{ inputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Dependencies
        run: |
          for i in 1 2 3; do npm ci && break; echo "npm ci failed ($i)"; sleep 30; done
          python3 -m pip install --quiet torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install --quiet faster-whisper gradio_client edge-tts
          echo "FFMPEG_PATH=$(node --input-type=module -e 'import ffmpeg from "ffmpeg-static"; process.stdout.write(ffmpeg)')" >> "$GITHUB_ENV"
      - name: Choose valid unpublished stories
        run: |
          git clone --quiet --depth 1 --branch auto-data https://github.com/Greater-Turkiye/datasets.git ../datasets
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' | sed -n 's/^video-//p' > published.txt
          node tools/scene/select.mjs --datasets ../datasets --published published.txt --max 25 --hours 8760 > candidates.txt
          test -s candidates.txt || { echo "No valid unpublished source records."; exit 1; }
          echo "Valid source-backed candidates: $(wc -l < candidates.txt)"
      - name: Generate local review previews
        run: |
          mkdir -p out/previews
          styles=(H C A D G K B E I)
          requested=${PREVIEW_COUNT:-20}
          [[ "$requested" =~ ^[0-9]+$ ]] || requested=20
          (( requested < 1 )) && requested=1
          (( requested > 20 )) && requested=20
          count=0
          index=0
          while IFS= read -r id && [ "$count" -lt "$requested" ]; do
            [ -n "$id" ] || continue
            scene="auto-$id"
            node tools/scene/generate.mjs --datasets ../datasets --id "$id" --variant standart --notes "out/previews/$id-notes.md" --meta "out/previews/$id.json"
            node tools/audio/narration.mjs "$scene" "out/previews/$id-narration.json"
            node tools/scene/nim-copy.mjs "scenes/auto/$scene.yaml" "out/previews/$id-narration.json"
            voice="out/previews/voice-$id"
            if ! python3 -u tools/audio/tts.py "out/previews/$id-narration.json" "$voice" omnivoice; then
              echo "OmniVoice unavailable or failed for $id; using Edge for the whole narration"
              rm -rf "$voice"
              python3 -u tools/audio/tts.py "out/previews/$id-narration.json" "$voice" edge
            fi
            node tools/audio/retime.mjs "$scene" "$voice"
            variants=1
            [ "$index" -lt 9 ] && variants=2
            for ((v=0; v<variants && count<requested; v++)); do
              style=${styles[$(((index * 2 + v) % ${#styles[@]}))]}
              node export/render.mjs --scene "$scene" --style "$style" --bitrate 6000000 --out out/previews
              source="out/previews/$scene-$style.mp4"
              target="out/previews/${id}-${style}.mp4"
              node tools/audio/voice.mjs "$voice" "$source" "$target" --kit assets/sound/kit.json --scene "$scene"
              count=$((count + 1))
            done
            index=$((index + 1))
          done < candidates.txt
          echo "Rendered $count style previews from $index distinct source records; repeated records are style variants, not new stories." | tee -a "$GITHUB_STEP_SUMMARY"
          printf 'story_id\tdate\tstyle\tpreview\n' > out/previews/manifest.tsv
          for file in out/previews/*.mp4; do
            base=$(basename "$file" .mp4)
            story=${base%-*}
            story=${story#auto-}
            date=$(jq -r '.date' "out/previews/$story.json")
            printf '%s\t%s\t%s\t%s\n' "$story" "$date" "${base##*-}" "$base.mp4" >> out/previews/manifest.tsv
          done
          {
            echo "# Video previews"
            echo
            echo "Rendered $count videos from $index distinct source records. A repeated story is a visual style variant, not a separate news event. No preview is published automatically."
            echo
            echo "See manifest.tsv for each source-record ID, event date, style, and file."
          } > out/previews/README.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: greater-turkiye-video-previews-${{ github.run_number }}
          path: out/previews/
          retention-days: 14
          if-no-files-found: error