name: llm-check
# One call to the copy editor's models (tools/scene/llm.mjs): which one answers, before a production
# spends half an hour on a video whose copy then falls back (2026-10-27: gemini-2.5-flash closed, NIM timing out).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVAPI: ${{ secrets.NVAPI }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL }}
        run: node tools/scene/llm.mjs
