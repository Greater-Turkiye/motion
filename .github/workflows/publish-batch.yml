name: publish-batch

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Number of fresh, distinct source-backed videos to publish"
        type: number
        default: 20

permissions:
  contents: write

concurrency:
  group: produce
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      records: ${{ steps.pick.outputs.records }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Select the freshest eligible records
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          COUNT: ${{ inputs.count }}
        run: |
          git clone --quiet --depth 1 --branch auto-data https://github.com/Greater-Turkiye/datasets.git ../datasets
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' | sed -n 's/^video-//p' > published.txt
          count=${COUNT:-20}
          [[ "$count" =~ ^[0-9]+$ ]] || count=20
          (( count < 1 )) && count=1
          (( count > 20 )) && count=20
          node tools/scene/select.mjs --datasets ../datasets --published published.txt --max "$count" --hours 48 > candidates.txt
          picked=$(grep -c '^evt_' candidates.txt || true)
          if [ "$picked" -lt "$count" ]; then
            echo "Only $picked distinct eligible stories are available; refusing to duplicate stories to reach $count." >&2
            exit 1
          fi
          records=$(jq -Rsc 'split("\n") | map(select(startswith("evt_"))) as $ids | [range(0;4) as $shard | {shard:$shard,ids:[range($shard;($ids|length);4) as $i | $ids[$i]]}] | {include:.}' candidates.txt)
          echo "records=$records" >> "$GITHUB_OUTPUT"
          printf 'Selected %s distinct recent records for live publication.\n' "$picked" | tee -a "$GITHUB_STEP_SUMMARY"

  render:
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.select.outputs.records) }}
    env:
      GH_TOKEN: ${{ github.token }}
      IDS: ${{ join(matrix.ids, ',') }}
      NVAPI: ${{ secrets.NVAPI }}
      NVIDIA_NIM_MODEL: ${{ vars.NVIDIA_NIM_MODEL }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_TTS_LICENSE_ACCEPTED: ${{ vars.HF_TTS_LICENSE_ACCEPTED }}
      HF_TTS_REFERENCE_AUDIO: referans.wav
      OMNIVOICE_SPACE: k2-fsa/OmniVoice
      OMNIVOICE_LANGUAGE: Turkish
      OMNIVOICE_INSTRUCT: ${{ vars.OMNIVOICE_INSTRUCT }}
      OMNIVOICE_STEPS: ${{ vars.OMNIVOICE_STEPS }}
      OMNIVOICE_GUIDANCE: ${{ vars.OMNIVOICE_GUIDANCE }}
      OMNIVOICE_SPEED: ${{ vars.OMNIVOICE_SPEED }}
      OMNIVOICE_TIMEOUT: "60"
      MOTION_TTS_ENGINE: ${{ vars.MOTION_TTS_ENGINE }}
      MOTION_VOICE: ${{ vars.MOTION_VOICE }}
      EDGE_TTS_VOICE: ${{ vars.EDGE_TTS_VOICE }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_VOICE: ${{ vars.GEMINI_VOICE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: assets/emblems
          key: emblems-${{ hashFiles('assets/emblems/manifest.json') }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Dependencies
        run: |
          for i in 1 2 3; do npm ci && break; echo "npm ci failed ($i)"; sleep 20; done
          python -m pip install --quiet torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet faster-whisper gradio_client edge-tts soundfile
          echo "FFMPEG_PATH=$(node --input-type=module -e 'import ffmpeg from "ffmpeg-static"; process.stdout.write(ffmpeg)')" >> "$GITHUB_ENV"
          python3 tools/data/fetch_emblems.py --sync
          git clone --quiet --depth 1 --branch auto-data https://github.com/Greater-Turkiye/datasets.git ../datasets
      - name: Generate and publish this shard's videos
        id: voice
        timeout-minutes: 85
        env:
          VOICEON: ${{ vars.MOTION_VOICE }}
          MUSIC: ${{ vars.MOTION_MUSIC }}
        run: |
          process_record() {
            local id="$1" scene="auto-$1" voice
            export ID="$id"
            rm -rf out/voice release
            node tools/scene/generate.mjs --datasets ../datasets --id "$id" --variant standart --notes notes.md --meta meta.json || return 1
            node tools/audio/narration.mjs "$scene" out/narration.json || return 1
            node tools/scene/nim-copy.mjs "scenes/auto/$scene.yaml" out/narration.json || return 1
            if [ "$VOICEON" = "off" ]; then
              voice=-
            else
              selected="${MOTION_TTS_ENGINE:-omnivoice-edge}"
              case "$selected" in
                omnivoice|omnivoice-edge)
                  if python -u tools/audio/tts.py out/narration.json out/voice omnivoice; then
                    voice=out/voice
                  else
                    echo "OmniVoice unavailable for $id; regenerating the whole narration with Edge"
                    rm -rf out/voice
                    python -u tools/audio/tts.py out/narration.json out/voice edge || return 1
                    voice=out/voice
                  fi
                  ;;
                *) python -u tools/audio/tts.py out/narration.json out/voice edge || return 1; voice=out/voice ;;
              esac
              node tools/audio/retime.mjs "$scene" "$voice" || return 1
              echo "voice: synthetic" >> "scenes/auto/$scene.yaml"
              engine=$(cat out/voice/engine.txt 2>/dev/null || echo edge)
              echo "Seslendirme: yapay ses ($engine; Whisper ile kontrol edildi). Voice-over: synthetic, Whisper-checked." >> notes.md
            fi
            node export/render.mjs --scene "$scene" --bitrate 8000000 --out out/video || return 1
            node export/render.mjs --no-build --scene "$scene" --frames-only --every 100000 --save-frames --out out/poster || return 1
            mkdir -p release
            kit=(--kit assets/sound/kit.json --scene "$scene"); [ "$MUSIC" = "off" ] && kit=()
            if [ "$voice" = "-" ] && [ ${#kit[@]} -eq 0 ]; then cp "out/video/$scene-"*.mp4 "release/$scene.mp4"
            else node tools/audio/voice.mjs "$voice" "out/video/$scene-"*.mp4 "release/$scene.mp4" "${kit[@]}" || return 1; fi
            cp out/poster/"$scene-"*-frames/0000.jpg "release/$scene.jpg" || return 1
            cp meta.json "release/$scene.json" || return 1
            title=$(node -e "const y=require('yaml');const s=y.parse(require('fs').readFileSync('scenes/auto/'+process.env.ID+'.yaml','utf8'));console.log(s.hook.lines.join(' ') + ' · ' + s.hook.kicker)") || return 1
            gh release create "video-$id" release/* --title "$title" --notes-file notes.md --latest=false || return 1
            echo "Published video-$id from a distinct source record." | tee -a "$GITHUB_STEP_SUMMARY"
          }
          failed=0
          IFS=',' read -r -a ids <<< "$IDS"
          for id in "${ids[@]}"; do
            [ -n "$id" ] || continue
            if ! process_record "$id"; then echo "Failed video-$id; continuing with this shard's remaining records."; failed=1; fi
          done
          exit "$failed"

  pages:
    needs: render
    if: always() && needs.select.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Publish the latest videos to Pages
        run: |
          mkdir -p site/v
          for tag in $(gh release list --limit 20 --json tagName --jq '.[].tagName' | grep -E '^(video-evt_|digest-)'); do
            gh release download "$tag" --dir site/v --pattern '*.mp4' --pattern '*.jpg' --pattern '*.json' --clobber
            rm -f site/v/*-muziksiz.mp4
          done
          gh release download studio --pattern studio.tar --dir . --clobber 2>/dev/null && tar -C site -xf studio.tar || echo "no studio yet"
          node tools/scene/site.mjs site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
