name: studio

# Draws a recent story of each family in every style (tools/scene/studio.mjs) and keeps the stills as
# the assets of a release tagged "studio", then asks the produce workflow to republish the Pages
# site, whose studio page shows them with each family's default style (config/styles.yaml) marked.
# Weekly, and on request after config/styles.yaml changes.
on:
  schedule:
    - cron: "37 4 * * 1"
  push:
    branches: [main]
    paths: ["config/styles.yaml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: studio
  cancel-in-progress: true

jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: assets/emblems
          key: emblems-${{ hashFiles('assets/emblems/manifest.json') }}
      # ffmpeg-static downloads its binary from GitHub's release storage, which answers 500 now and
      # then (twice on 2 October): three tries a minute apart before the run fails
      - run: for i in 1 2 3; do npm ci && exit 0; echo "npm ci failed ($i), retrying"; sleep 60; done; exit 1
      - name: Emblems (pinned by hash in the manifest)
        run: python3 tools/data/fetch_emblems.py --sync
      - name: Stills
        run: |
          git clone --quiet --depth 1 --branch auto-data https://github.com/Greater-Turkiye/datasets.git ../datasets
          node tools/scene/studio.mjs --datasets ../datasets --out out/studio
          tar -C out -cf studio.tar studio
      - name: Keep them as the studio release
        run: |
          gh release view studio >/dev/null 2>&1 || gh release create studio --prerelease --title "Stüdyo" --notes "Her olay ailesinden güncel bir haber, dokuz stilde (tools/scene/studio.mjs). Otomatik yenilenir."
          gh release upload studio studio.tar --clobber
      - name: Republish the Pages site
        run: gh workflow run produce.yml -f pages_only=true
