name: produce

# The automatic video loop (PLAN.md section 10, milestone M7). At most every twelve hours (the
# gate below) — two videos a day, the two best recent records, rather than the three or four a day
# that an earlier 5 h 30 min cadence produced (owner, 2026-10-16): pick the best recent record that
# has no video yet (tools/scene/select.mjs), write its
# scene (tools/scene/generate.mjs), narrate it, render it, and publish the MP4, its first frame and its
# metadata as a GitHub release tagged video-<record id>. The releases are the ledger: a record with a
# release is never picked again. The second job republishes the latest twenty videos to this
# repository's Pages site (greater-turkiye.github.io/motion/), which the platform's videos page reads
# from the same origin. Nobody writes or reviews anything on the way; the
# status and the source are on screen in every frame and the release notes say it was automatic.
#
# Cadence: GitHub delays scheduled runs under load and sometimes drops them (a 12:43 run started at
# 18:08 on 2026-09-30; on the night of 1 October only one hourly wake-up in four ran, here and in
# the datasets and platform repositories alike), so the schedule wakes three times an hour at
# off-peak minutes and the gate job ends the run in seconds unless the last video is at least 12 h
# old. In practice the schedule ran about once in four hours on 1-2 October, so the clock is now
# timer.yml: every production ends by starting a timer run that sleeps until the next video is due
# and then starts this workflow. The schedule stays as the second line. No secret is needed.
#
# Narration (PLAN.md sections 15.7, 23): the voice tells the scene's facts in sentences of its own. When
# narration is wanted and every engine fails, the run stops with an error rather than publishing a silent
# video (owner, 8 October): a video is never shipped without its voice. MOTION_VOICE set to "off" is the
# one deliberate exception — it skips narration and publishes silent on purpose.
#
# Kill switch: set the repository variable MOTION_PRODUCE to "off".
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      record:
        description: "Record id to render instead of the selector's pick (optional)"
        required: false
      pages_only:
        description: "Only republish the Pages site from the existing releases"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: produce
  cancel-in-progress: false

jobs:
  gate:
    if: vars.MOTION_PRODUCE != 'off' && !inputs.pages_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.age.outputs.go }}
    env:
      GH_TOKEN: ${{ github.token }}
      EVENT: ${{ github.event_name }}
    steps:
      - id: age
        run: |
          last=$(gh release list -R "$GITHUB_REPOSITORY" --limit 20 --json tagName,publishedAt --jq '[.[]|select(.tagName|startswith("video-"))][0].publishedAt // ""')
          age=999999
          if [ -n "$last" ]; then age=$(( ($(date -u +%s) - $(date -u -d "$last" +%s)) / 60 )); fi
          go=false
          if [ "$EVENT" != "schedule" ] || [ "$age" -ge 720 ]; then go=true; fi
          echo "last video: ${last:-none} (${age} min ago); go=$go" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "go=$go" >> "$GITHUB_OUTPUT"

  produce:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90   # motion blur can double a software render; the narration and its checks add up to 40 min
    outputs:
      id: ${{ steps.pick.outputs.id }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: assets/emblems
          key: emblems-${{ hashFiles('assets/emblems/manifest.json') }}
      # ffmpeg-static downloads its binary from GitHub's release storage, which answers 500 now and
      # then (twice on 2 October): three tries a minute apart before the run fails
      - run: for i in 1 2 3; do npm ci && exit 0; echo "npm ci failed ($i), retrying"; sleep 60; done; exit 1
      - name: Emblems (pinned by hash in the manifest)
        run: python3 tools/data/fetch_emblems.py --sync
      - name: Choose a record
        id: pick
        env:
          RECORD: ${{ inputs.record }}
        run: |
          git clone --quiet --depth 1 --branch auto-data https://github.com/Greater-Turkiye/datasets.git ../datasets
          # a story the Greater Türkiye channel already told (produce-gt.yml, gt-<record>) is published too
          gh release list --limit 400 --json tagName --jq '.[].tagName' | sed -nE 's/^(video|gt)-//p' > published.txt
          if [ -n "$RECORD" ]; then id="$RECORD"; else id=$(node tools/scene/select.mjs --datasets ../datasets --published published.txt); fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "record: ${id:-none}" >> "$GITHUB_STEP_SUMMARY"
      - name: Scene
        id: scene
        if: steps.pick.outputs.id != ''
        env:
          ID: ${{ steps.pick.outputs.id }}
        run: |
          # the story-order variants take turns (PLAN.md section 16), so their numbers can be compared
          n=$(gh release list --limit 200 --json tagName --jq '[.[]|select(.tagName|startswith("video-"))]|length')
          variants=(standart yakinlik kisa oruntu)
          variant=${variants[$((n % 4))]}
          echo "variant: $variant" >> "$GITHUB_STEP_SUMMARY"
          # NASA FIRMS heat detections of the last seven days (VIIRS, NOAA-20; public domain, no key): a
          # war item's scene shows those around its place (PLAN.md section 25). Europe ends at 35° E and
          # Russia_Asia starts at 26° E, so the two cover Ukraine; without them the scene has no such block
          firms=
          for r in Europe Russia_Asia; do
            if curl -sfL --max-time 120 -A "GreaterTurkiyeMotion (+https://github.com/Greater-Turkiye/motion)" \
                 -o "firms-$r.csv" "https://firms.modaps.eosdis.nasa.gov/data/active_fire/noaa-20-viirs-c2/csv/J1_VIIRS_C2_${r}_7d.csv"; then
              firms="${firms:+$firms,}firms-$r.csv"
            else echo "FIRMS $r unavailable: no satellite block"; fi
          done
          # the story's own photograph when its source publishes one in the public domain and it shows
          # no recognisable face (tools/scene/photo.mjs, tools/scene/faces.py; PLAN.md section 29)
          python3 -m pip install --quiet "opencv-python-headless<5" || echo "no OpenCV: no photograph"
          node tools/scene/photo.mjs ../datasets "$ID" assets/photos > photo.json || true
          photo=(); [ -s photo.json ] && photo=(--photo photo.json) && echo "photo: $(cat photo.json)" >> "$GITHUB_STEP_SUMMARY"
          # a style none of the channel's last four videos used (config/styles.yaml pools)
          recent=$(bash tools/post/recent-styles.sh video- || true)
          echo "recent styles: ${recent:-none}" >> "$GITHUB_STEP_SUMMARY"
          echo "recent=$recent" >> "$GITHUB_OUTPUT"
          node tools/scene/generate.mjs --datasets ../datasets --id "$ID" --variant "$variant" --recent "$recent" --notes notes.md --meta meta.json ${firms:+--firms "$firms"} "${photo[@]}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.pick.outputs.id != '' && vars.MOTION_VOICE != 'off'
        with:
          python-version: "3.11"
      - name: Narration
        id: voice
        if: steps.pick.outputs.id != '' && vars.MOTION_VOICE != 'off'
        # No continue-on-error: when narration is wanted (MOTION_VOICE != off) and every engine fails,
        # this step fails and the job stops here. The later steps carry an implicit success() with their
        # own `if:`, so none of them run and no silent video is ever published. The only silent video is
        # the deliberate one, MOTION_VOICE=off, which skips this step rather than failing it.
        # Kaggle Fish S2 Pro may spend several minutes starting a GPU and loading its reference prompt.
        timeout-minutes: 70
        env:
          ID: ${{ steps.pick.outputs.id }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_VOICE: ${{ vars.GEMINI_VOICE }}
          NVAPI: ${{ secrets.NVAPI }}
          MOTION_TTS_ENGINE: ${{ vars.MOTION_TTS_ENGINE }}
          EDGE_TTS_VOICE: ${{ vars.EDGE_TTS_VOICE }}
          HF_TTS_SPACE: ${{ vars.HF_TTS_SPACE }}
          HF_TTS_REFERENCE_REPO: ${{ vars.HF_TTS_REFERENCE_REPO }}
          HF_TTS_REFERENCE_FILE: ${{ vars.HF_TTS_REFERENCE_FILE }}
          HF_TTS_LICENSE_ACCEPTED: ${{ vars.HF_TTS_LICENSE_ACCEPTED }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # the new Kaggle account's token (owner, 2026-10-23). secrets.KAGGLE_API_TOKEN belongs to @trnntr
          # and must never be used again (CLAUDE.md section 5); kaggle_submit.py also refuses that account
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_AVAIBLE_TOKEN }}
          KAGGLE_BLOCKED_ACCOUNTS: ${{ vars.KAGGLE_BLOCKED_ACCOUNTS || 'trnntr' }}
          HF_TTS_REFERENCE_AUDIO: referans.wav
          OMNIVOICE_SPACE: k2-fsa/OmniVoice
          OMNIVOICE_LANGUAGE: Turkish
          OMNIVOICE_INSTRUCT: ${{ vars.OMNIVOICE_INSTRUCT }}
          OMNIVOICE_STEPS: ${{ vars.OMNIVOICE_STEPS }}
          OMNIVOICE_GUIDANCE: ${{ vars.OMNIVOICE_GUIDANCE }}
          OMNIVOICE_SPEED: ${{ vars.OMNIVOICE_SPEED }}
        run: |
          node tools/audio/narration.mjs "auto-$ID" out/narration.json
          node tools/scene/nim-copy.mjs "scenes/auto/auto-$ID.yaml" out/narration.json
          export FFMPEG_PATH="$(node --input-type=module -e 'import ffmpeg from "ffmpeg-static"; process.stdout.write(ffmpeg)')"
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet faster-whisper
          # soundfile (libsndfile), not torchcodec, is tts.py's audio I/O backend: the CPU runner has no
          # CUDA, and torchcodec failed to load (libnvrtc.so.13), which crashed every TTS engine.
          python -m pip install --quiet gradio_client edge-tts soundfile kaggle==2.2.4
          fallback_chatterbox() {
            rm -rf out/voice
            python -m pip install --quiet chatterbox-tts
            python -u tools/audio/tts.py out/narration.json out/voice chatterbox
          }
          selected="${MOTION_TTS_ENGINE:-omnivoice-edge}"
          case "$selected" in
            omnivoice|omnivoice-edge)
              if ! python -u tools/audio/tts.py out/narration.json out/voice omnivoice; then
                echo "OmniVoice unavailable or failed; using Edge TTS for the whole narration"
                rm -rf out/voice
                if ! python -u tools/audio/tts.py out/narration.json out/voice edge; then
                  echo "::error::both OmniVoice and Edge TTS failed; stopping the run instead of publishing a silent video"
                  exit 1
                fi
              fi
              ;;
            edge)
              python -u tools/audio/tts.py out/narration.json out/voice edge
              ;;
            kaggle-fish)
              # Kaggle's weekly GPU quota runs out ("The pushed Kaggle kernel never started a new run",
              # 22 October): every production then failed and no video shipped. The CPU voices take over.
              if ! python -u tools/voice-lab/kaggle_submit.py out/narration.json out/voice --reference referans.wav --reference-text assets/voice/reference-transcript.txt; then
                echo "::warning::Kaggle Fish failed (GPU quota or queue); using OmniVoice, then Edge TTS"
                rm -rf out/voice
                if ! python -u tools/audio/tts.py out/narration.json out/voice omnivoice; then
                  rm -rf out/voice
                  if ! python -u tools/audio/tts.py out/narration.json out/voice edge; then
                    echo "::error::Kaggle Fish, OmniVoice and Edge TTS all failed; stopping the run instead of publishing a silent video"
                    exit 1
                  fi
                fi
              fi
              ;;
            gemini)
              if [ -z "$GEMINI_API_KEY" ] || ! python -u tools/audio/tts.py out/narration.json out/voice gemini; then
                echo "Gemini unavailable or failed; using Chatterbox for the whole narration"
                fallback_chatterbox
              fi
              ;;
            chatterbox)
              fallback_chatterbox
              ;;
            *)
              echo "Unknown MOTION_TTS_ENGINE=$selected; using Chatterbox"
              fallback_chatterbox
              ;;
          esac
          # the picture waits for the voice: blocks lengthen until each clip fits
          node tools/audio/retime.mjs "auto-$ID" out/voice
          # only now, with every clip made, is the scene marked as narrated
          echo "voice: synthetic" >> "scenes/auto/auto-$ID.yaml"
          engine=$(cat out/voice/engine.txt 2>/dev/null || echo chatterbox)
          case "$engine" in
            omnivoice) voice_label="OmniVoice" ;;
            hf) voice_label="Hugging Face XTTS Space" ;;
            edge) voice_label="Edge TTS ($EDGE_TTS_VOICE)" ;;
            gemini) voice_label="Gemini TTS" ;;
            fish-s2-pro) voice_label="Fish Audio S2 Pro" ;;
            *) voice_label="Chatterbox Multilingual, MIT" ;;
          esac
          # the pictures are drawn by code, not generated: no AI label (owner, 2026-10-26); the voice engine is credited
          { echo; echo "Animasyon: Greater Türkiye motion yazılımıyla kodla çizildi. Seslendirme: $voice_label. Animation drawn in code; voice: $voice_label."; } >> notes.md
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Video and poster
        if: steps.pick.outputs.id != ''
        env:
          ID: ${{ steps.pick.outputs.id }}
          VOICE: ${{ steps.voice.outputs.ok }}
          VOICEON: ${{ vars.MOTION_VOICE }}
          MUSIC: ${{ vars.MOTION_MUSIC }}
        run: |
          scene="auto-$ID"
          # --encoder ffmpeg: a software, frame-by-frame H.264 encode at a constant 30 fps (export/render.mjs),
          # not the browser's WebCodecs path, so the output plays back smoothly on the GPU-less runner.
          node export/render.mjs --encoder ffmpeg --scene "$scene" --out out/video
          node export/render.mjs --no-build --scene "$scene" --frames-only --every 100000 --save-frames --out out/poster
          mkdir -p release
          # the sound: the narration when it was made, and the kit (bed and effects) either way
          # A failed narration already stopped the job, so reaching here with no voice is only valid when
          # voice is deliberately off; otherwise refuse rather than publish a silent video.
          if [ "$VOICE" = "true" ]; then voice=out/voice
          elif [ "$VOICEON" = "off" ]; then voice=-
          else echo "::error::narration is missing but MOTION_VOICE is not off; refusing to publish a silent video"; exit 1; fi
          # MOTION_MUSIC=off drops the kit (bed and effects): the first answer to a copyright claim on a
          # platform, until the claim is disputed with the CC0 record in LICENSES.md
          kit=(--kit assets/sound/kit-kenney.json --scene "$scene"); [ "$MUSIC" = "off" ] && kit=()
          if [ "$voice" = "-" ] && [ ${#kit[@]} -eq 0 ]; then cp out/video/*.mp4 "release/$scene.mp4"
          else node tools/audio/voice.mjs "$voice" out/video/*.mp4 "release/$scene.mp4" "${kit[@]}"; fi
          # a copy without the music bed, the voice alone: the platforms' own sound libraries (Reels,
          # TikTok, Shorts) license trending music added in the app when posting, which our bed would
          # clash with (owner, 6 October; PLAN.md section 27)
          if [ "$voice" != "-" ] && [ ${#kit[@]} -gt 0 ]; then node tools/audio/voice.mjs "$voice" out/video/*.mp4 "release/$scene-muziksiz.mp4"; fi
          cp out/poster/*-frames/0000.jpg "release/$scene.jpg"
          # the Instagram carousel: one 4:5 slide per block, from the same renderer (tools/post/carousel.mjs)
          node tools/post/carousel.mjs "$scene" release --no-build
          cp meta.json "release/$scene.json"
          # the words that go with it when it is posted: Instagram, YouTube Shorts, X (tools/post/captions.mjs)
          node tools/post/captions.mjs "$scene" meta.json release
          ls -la release
      - name: Publish
        if: steps.pick.outputs.id != ''
        env:
          ID: ${{ steps.pick.outputs.id }}
        run: |
          case "$ID" in evt_[0-9a-z]*) ;; *) echo "not a record id: $ID"; exit 1 ;; esac
          title=$(node -e "const y=require('yaml');const s=y.parse(require('fs').readFileSync('scenes/auto/auto-'+process.env.ID+'.yaml','utf8'));console.log(s.hook.lines.join(' ') + ' · ' + s.hook.kicker)")
          gh release create "video-$ID" release/* --title "$title" --notes-file notes.md --latest=false
          echo "published: video-$ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to YouTube Shorts
        if: steps.pick.outputs.id != ''
        continue-on-error: true
        env:
          ID: ${{ steps.pick.outputs.id }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          # one client, a refresh token per channel: Turkish @ConflictGridTR, English @Conflict-Grid
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_REFRESH_TOKEN_EN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_EN }}
          YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS }}
          # the YouTube link is written back to the release (notes and metadata), so GitHub lists it
          RELEASE_TAG: video-${{ steps.pick.outputs.id }}
        run: node tools/post/youtube-upload.mjs "auto-$ID" meta.json "release/auto-$ID.mp4" tr

      # The English channel (@Conflict-Grid): the same record in English. The whole track is
      # continue-on-error and gated on the step before it, so if any part fails the Turkish video has
      # already shipped and only the English upload is missed; the next run tries again.
      - name: English translation
        id: translate
        if: steps.pick.outputs.id != '' && steps.voice.outputs.ok == 'true'
        continue-on-error: true
        env:
          ID: ${{ steps.pick.outputs.id }}
          NVAPI: ${{ secrets.NVAPI }}
        run: |
          # NIM (gemma) translates the finished Turkish scene and narration; refit stretches the
          # timeline for the longer English copy. Writes nothing on failure (then the track skips).
          node tools/scene/translate.mjs "scenes/auto/auto-$ID.yaml" out/narration.json "scenes/auto/auto-$ID.en.yaml" out/narration.en.json
          if [ -f "scenes/auto/auto-$ID.en.yaml" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "no English scene written; skipping the English track"; fi
      - name: Kokoro model cache
        if: steps.translate.outputs.ok == 'true'
        continue-on-error: true
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: kokoro
          key: kokoro-onnx-model-files-v1.0
      - name: English narration voice
        id: voice_en
        if: steps.translate.outputs.ok == 'true'
        continue-on-error: true
        env:
          ID: ${{ steps.pick.outputs.id }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # the new Kaggle account's token (owner, 2026-10-23). secrets.KAGGLE_API_TOKEN belongs to @trnntr
          # and must never be used again (CLAUDE.md section 5); kaggle_submit.py also refuses that account
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_AVAIBLE_TOKEN }}
          KAGGLE_BLOCKED_ACCOUNTS: ${{ vars.KAGGLE_BLOCKED_ACCOUNTS || 'trnntr' }}
          FISH_MODEL_DATASET: ${{ vars.FISH_MODEL_DATASET }}
          FISH_TEMPERATURE: ${{ vars.FISH_TEMPERATURE }}
          FISH_TOP_P: ${{ vars.FISH_TOP_P }}
          FISH_TOP_K: ${{ vars.FISH_TOP_K }}
          FISH_SEED: ${{ vars.FISH_SEED }}
          FISH_MAX_REFERENCES: ${{ vars.FISH_MAX_REFERENCES }}
          EN_TTS_ENGINE: ${{ vars.MOTION_EN_TTS_ENGINE }}
          KOKORO_VOICE: ${{ vars.KOKORO_VOICE }}
          KOKORO_SPEED: ${{ vars.KOKORO_SPEED }}
        run: |
          # kokoro (default): Kokoro-82M on the CPU, a British news voice (bf_emma), checked clip by clip
          # with Whisper like the Turkish voice. kaggle-fish: the cloned Turkish timbre speaking English
          # on a Kaggle GPU (--lang en runs tools/voice-lab/en_tts_prep.py for "I" and acronyms); when
          # Kaggle's weekly quota is spent it fails, and Kokoro takes over.
          if [ "${EN_TTS_ENGINE:-kokoro}" = "kaggle-fish" ]; then
            if python -u tools/voice-lab/kaggle_submit.py out/narration.en.json out/voice-en --lang en --reference referans.wav --reference-text assets/voice/reference-transcript.txt; then
              fish=ok
            else
              echo "::warning::English Fish narration failed; using Kokoro"
              rm -rf out/voice-en
            fi
          fi
          if [ "$fish" != ok ]; then
            mkdir -p kokoro
            fetch() { [ -f "kokoro/$1" ] || curl -fsSL --retry 3 -o "kokoro/$1" "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$1"; }
            fetch kokoro-v1.0.onnx && fetch voices-v1.0.bin
            printf '%s  %s\n' \
              7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5 kokoro/kokoro-v1.0.onnx \
              bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d kokoro/voices-v1.0.bin | sha256sum -c -
            python -m pip install --quiet kokoro-onnx==0.4.7
            if ! TTS_LANG=en KOKORO_MODEL_DIR=kokoro python -u tools/audio/tts.py out/narration.en.json out/voice-en kokoro; then
              echo "::warning::English Kokoro narration failed; skipping the English track this run"; exit 0
            fi
          fi
          node tools/audio/retime.mjs "auto-$ID.en" out/voice-en
          echo "voice: synthetic" >> "scenes/auto/auto-$ID.en.yaml"
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: English video and YouTube upload
        if: steps.voice_en.outputs.ok == 'true'
        continue-on-error: true
        env:
          ID: ${{ steps.pick.outputs.id }}
          MUSIC: ${{ vars.MOTION_MUSIC }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN_EN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_EN }}
          YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS }}
          EN_STYLE: ${{ vars.MOTION_EN_STYLE }}
          RECENT: ${{ steps.scene.outputs.recent }}
        run: |
          scene="auto-$ID.en"
          export FFMPEG_PATH="$(node --input-type=module -e 'import ffmpeg from "ffmpeg-static"; process.stdout.write(ffmpeg)')"
          # its own look: the same frames minutes after the Turkish upload read as a re-upload, and the
          # English channel's shorts got no test audience (1-15 views each, 15-18 October). A style that
          # cannot fit the English copy falls back to the scene's own. Not one fixed style either (every
          # English video was D): its pool's first style that neither the Turkish cut nor the Turkish
          # channel's last videos used (owner, 2026-10-26)
          style="$EN_STYLE"
          [ -n "$style" ] || style=$(node --input-type=module -e '
            import { readFileSync } from "node:fs"; import { styleFor } from "./tools/scene/generate.mjs";
            const m = JSON.parse(readFileSync("meta.json", "utf8"));
            const recent = String(process.env.RECENT ?? "").split(",").filter(Boolean);
            process.stdout.write(styleFor(m.event_type ?? "", [m.style, ...recent]));' || echo D)
          echo "English style: $style" >> "$GITHUB_STEP_SUMMARY"
          if ! node export/render.mjs --encoder ffmpeg --scene "$scene" --style "$style" --out out/video-en; then
            echo "::warning::English render in style $style failed; using the scene's own style"
            rm -rf out/video-en
            node export/render.mjs --encoder ffmpeg --scene "$scene" --out out/video-en
          fi
          mkdir -p release-en
          kit=(--kit assets/sound/kit-kenney.json --scene "$scene"); [ "$MUSIC" = "off" ] && kit=()
          node tools/audio/voice.mjs out/voice-en out/video-en/*.mp4 "release-en/$scene.mp4" "${kit[@]}"
          # the English cut joins the story's release, so the site's videos page has it too
          gh release upload "video-$ID" "release-en/$scene.mp4" --clobber || echo "::warning::could not add the English cut to video-$ID"
          # English posting text (captions reads scene.lang and writes the English block)
          node tools/post/captions.mjs "$scene" meta.json release-en
          RELEASE_TAG="video-$ID" node tools/post/youtube-upload.mjs "$scene" meta.json "release-en/$scene.mp4" en

  # the clock (timer.yml): after every production, a timer run sleeps until the next video is due.
  # The schedule above is only the second line: it ran about once in four hours on 1-2 October.
  timer:
    needs: [gate, produce]
    if: always() && vars.MOTION_PRODUCE != 'off' && needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: gh workflow run timer.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
      # the weekly digest's own schedule (Mondays 06:27) is GitHub's, which ran late or not at all
      # (5 October: nothing by 06:52): on a Monday a production starts the digest when no digest run
      # has started that day; the digest itself skips a week already published
      - name: The weekly digest, if its schedule has not run
        run: |
          [ "$(date -u +%u)" = 1 ] || exit 0
          today=$(date -u +%F)
          ran=$(gh run list -R "$GITHUB_REPOSITORY" --workflow digest.yml --limit 10 --json createdAt --jq "[.[]|select(.createdAt|startswith(\"$today\"))]|length")
          if [ "$ran" = 0 ]; then gh workflow run digest.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"; echo "digest started"; else echo "digest already ran today"; fi

  pages:
    needs: produce
    # after a new video, or when asked for directly; a run that published nothing changes nothing
    if: always() && vars.MOTION_PRODUCE != 'off' && (needs.produce.outputs.id != '' || inputs.pages_only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Every video
        run: |
          # every release, newest first, while 850 MB of MP4s lasts (Pages allows 1 GB): the videos stay
          # on the site's own origin because the platform's CSP loads nothing from elsewhere. A release
          # whose MP4s no longer fit is left out whole; tools/scene/site.mjs lists what is here.
          mkdir -p site/v
          budget=$((850 * 1024 * 1024)); used=0
          for tag in $(gh release list --limit 1000 --json tagName --jq '.[].tagName' | grep -E '^(video-evt_|digest-)'); do
            # the voice-only copy (-muziksiz) is for posting, not for the site
            size=$(gh release view "$tag" --json assets --jq '[.assets[] | select(.name | endswith(".mp4")) | select(.name | endswith("-muziksiz.mp4") | not) | .size] | add // 0')
            if [ $((used + size)) -gt "$budget" ]; then echo "budget full: $tag and older stay on their releases"; break; fi
            gh release download "$tag" --dir site/v --pattern '*.mp4' --pattern '*.jpg' --pattern '*.json' --clobber
            rm -f site/v/*-muziksiz.mp4
            used=$((used + size))
          done
          echo "MP4s on the site: $((used / 1024 / 1024)) MB"
          # the other channels' videos (Greater Türkiye, Greater Earth and the Türkiye quake channel, Greater
          # Defence) are listed on the index with their YouTube links: their metadata only, no MP4
          for tag in $(gh release list --limit 400 --json tagName --jq '.[].tagName' | grep -E '^(gt-|quake-|defence-)'); do
            mkdir -p "site/m/$tag"
            gh release download "$tag" --dir "site/m/$tag" --pattern '*.json' --clobber || true
          done
          # the studio stills, when the studio workflow has made them
          gh release download studio --pattern studio.tar --dir . --clobber 2>/dev/null && tar -C site -xf studio.tar || echo "no studio yet"
          node tools/scene/site.mjs site
          du -sh site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
