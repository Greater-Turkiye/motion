name: produce

# The automatic video loop (PLAN.md section 10, milestone M7). At most every five and a half hours (the
# gate below): pick the best recent record that has no video yet (tools/scene/select.mjs), write its
# scene (tools/scene/generate.mjs), narrate it, render it, and publish the MP4, its first frame and its
# metadata as a GitHub release tagged video-<record id>. The releases are the ledger: a record with a
# release is never picked again. The second job republishes the latest twenty videos to this
# repository's Pages site (greater-turkiye.github.io/motion/), which the platform's videos page reads
# from the same origin. Nobody writes or reviews anything on the way; the
# status and the source are on screen in every frame and the release notes say it was automatic.
#
# Cadence: GitHub delays scheduled runs under load and sometimes drops them (a 12:43 run started at
# 18:08 on 2026-09-30; on the night of 1 October only one hourly wake-up in four ran, here and in
# the datasets and platform repositories alike), so the schedule wakes three times an hour at
# off-peak minutes and the gate job ends the run in seconds unless the last video is at least 5 h
# 30 min old. In practice the schedule ran about once in four hours on 1-2 October, so the clock is now
# timer.yml: every production ends by starting a timer run that sleeps until the next video is due
# and then starts this workflow. The schedule stays as the second line. No secret is needed.
#
# Narration (PLAN.md sections 15.7, 23): Chatterbox tells the scene's facts in sentences of its own; the scene then
# says "SESLENDİRME: YAPAY SES" in every frame. If the voice fails the video goes out silent and without
# the note; production does not stop for it. MOTION_VOICE set to "off" turns narration off.
#
# Kill switch: set the repository variable MOTION_PRODUCE to "off".
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      record:
        description: "Record id to render instead of the selector's pick (optional)"
        required: false
      pages_only:
        description: "Only republish the Pages site from the existing releases"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: produce
  cancel-in-progress: false

jobs:
  gate:
    if: vars.MOTION_PRODUCE != 'off' && !inputs.pages_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.age.outputs.go }}
    env:
      GH_TOKEN: ${{ github.token }}
      EVENT: ${{ github.event_name }}
    steps:
      - id: age
        run: |
          last=$(gh release list -R "$GITHUB_REPOSITORY" --limit 20 --json tagName,publishedAt --jq '[.[]|select(.tagName|startswith("video-"))][0].publishedAt // ""')
          age=999999
          if [ -n "$last" ]; then age=$(( ($(date -u +%s) - $(date -u -d "$last" +%s)) / 60 )); fi
          go=false
          if [ "$EVENT" != "schedule" ] || [ "$age" -ge 330 ]; then go=true; fi
          echo "last video: ${last:-none} (${age} min ago); go=$go" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "go=$go" >> "$GITHUB_OUTPUT"

  produce:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90   # motion blur can double a software render; the narration and its checks add up to 40 min
    outputs:
      id: ${{ steps.pick.outputs.id }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: assets/emblems
          key: emblems-${{ hashFiles('assets/emblems/manifest.json') }}
      # ffmpeg-static downloads its binary from GitHub's release storage, which answers 500 now and
      # then (twice on 2 October): three tries a minute apart before the run fails
      - run: for i in 1 2 3; do npm ci && exit 0; echo "npm ci failed ($i), retrying"; sleep 60; done; exit 1
      - name: Emblems (pinned by hash in the manifest)
        run: python3 tools/data/fetch_emblems.py --sync
      - name: Choose a record
        id: pick
        env:
          RECORD: ${{ inputs.record }}
        run: |
          git clone --quiet --depth 1 --branch auto-data https://github.com/Greater-Turkiye/datasets.git ../datasets
          gh release list --limit 200 --json tagName --jq '.[].tagName' | sed -n 's/^video-//p' > published.txt
          if [ -n "$RECORD" ]; then id="$RECORD"; else id=$(node tools/scene/select.mjs --datasets ../datasets --published published.txt); fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "record: ${id:-none}" >> "$GITHUB_STEP_SUMMARY"
      - name: Scene
        if: steps.pick.outputs.id != ''
        env:
          ID: ${{ steps.pick.outputs.id }}
        run: |
          # the story-order variants take turns (PLAN.md section 16), so their numbers can be compared
          n=$(gh release list --limit 200 --json tagName --jq '[.[]|select(.tagName|startswith("video-"))]|length')
          variants=(standart yakinlik kisa oruntu)
          variant=${variants[$((n % 4))]}
          echo "variant: $variant" >> "$GITHUB_STEP_SUMMARY"
          # NASA FIRMS heat detections of the last seven days (VIIRS, NOAA-20; public domain, no key): a
          # war item's scene shows those around its place (PLAN.md section 25). Europe ends at 35° E and
          # Russia_Asia starts at 26° E, so the two cover Ukraine; without them the scene has no such block
          firms=
          for r in Europe Russia_Asia; do
            if curl -sfL --max-time 120 -A "GreaterTurkiyeMotion (+https://github.com/Greater-Turkiye/motion)" \
                 -o "firms-$r.csv" "https://firms.modaps.eosdis.nasa.gov/data/active_fire/noaa-20-viirs-c2/csv/J1_VIIRS_C2_${r}_7d.csv"; then
              firms="${firms:+$firms,}firms-$r.csv"
            else echo "FIRMS $r unavailable: no satellite block"; fi
          done
          node tools/scene/generate.mjs --datasets ../datasets --id "$ID" --variant "$variant" --notes notes.md --meta meta.json ${firms:+--firms "$firms"}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.pick.outputs.id != '' && vars.MOTION_VOICE != 'off'
        with:
          python-version: "3.11"
      - name: Narration
        id: voice
        if: steps.pick.outputs.id != '' && vars.MOTION_VOICE != 'off'
        continue-on-error: true
        # ~1 min a clip with its check; three tries for every clip of a long scene stays under 40
        timeout-minutes: 40
        env:
          ID: ${{ steps.pick.outputs.id }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node tools/audio/narration.mjs "auto-$ID" out/narration.json
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet faster-whisper
          # the Gemini voice when the GEMINI_API_KEY secret is set (PLAN.md 24); with no key, or when it
          # fails, the whole narration is made again with Chatterbox, so a video never mixes two voices
          if [ -z "$GEMINI_API_KEY" ] || ! python -u tools/audio/tts.py out/narration.json out/voice gemini; then
            rm -rf out/voice
            python -m pip install --quiet chatterbox-tts
            python -u tools/audio/tts.py out/narration.json out/voice chatterbox
          fi
          # the picture waits for the voice: blocks lengthen until each clip fits
          node tools/audio/retime.mjs "auto-$ID" out/voice
          # only now, with every clip made, does the scene carry the synthetic-voice note
          echo "voice: synthetic" >> "scenes/auto/auto-$ID.yaml"
          { echo; echo "Seslendirme: yapay ses ($([ "$(cat out/voice/engine.txt 2>/dev/null)" = gemini ] && echo "Gemini TTS, Google, SynthID filigranlı" || echo "Chatterbox Multilingual, MIT"); ekrandaki olguları kendi cümleleriyle anlatır). Voice-over: synthetic, telling the on-screen facts in its own sentences."; } >> notes.md
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Video and poster
        if: steps.pick.outputs.id != ''
        env:
          ID: ${{ steps.pick.outputs.id }}
          VOICE: ${{ steps.voice.outputs.ok }}
          MUSIC: ${{ vars.MOTION_MUSIC }}
        run: |
          scene="auto-$ID"
          node export/render.mjs --scene "$scene" --bitrate 8000000 --out out/video
          node export/render.mjs --no-build --scene "$scene" --frames-only --every 100000 --save-frames --out out/poster
          mkdir -p release
          # the sound: the narration when it was made, and the kit (bed and effects) either way
          if [ "$VOICE" = "true" ]; then voice=out/voice; else voice=-; fi
          # MOTION_MUSIC=off drops the kit (bed and effects): the first answer to a copyright claim on a
          # platform, until the claim is disputed with the CC0 record in LICENSES.md
          kit=(--kit assets/sound/kit.json --scene "$scene"); [ "$MUSIC" = "off" ] && kit=()
          if [ "$voice" = "-" ] && [ ${#kit[@]} -eq 0 ]; then cp out/video/*.mp4 "release/$scene.mp4"
          else node tools/audio/voice.mjs "$voice" out/video/*.mp4 "release/$scene.mp4" "${kit[@]}"; fi
          cp out/poster/*-frames/0000.jpg "release/$scene.jpg"
          # the Instagram carousel: one 4:5 slide per block, from the same renderer (tools/post/carousel.mjs)
          node tools/post/carousel.mjs "$scene" release --no-build
          cp meta.json "release/$scene.json"
          # the words that go with it when it is posted: Instagram, YouTube Shorts, X (tools/post/captions.mjs)
          node tools/post/captions.mjs "$scene" meta.json release
          ls -la release
      - name: Publish
        if: steps.pick.outputs.id != ''
        env:
          ID: ${{ steps.pick.outputs.id }}
        run: |
          case "$ID" in evt_[0-9a-z]*) ;; *) echo "not a record id: $ID"; exit 1 ;; esac
          title=$(node -e "const y=require('yaml');const s=y.parse(require('fs').readFileSync('scenes/auto/auto-'+process.env.ID+'.yaml','utf8'));console.log(s.hook.lines.join(' ') + ' · ' + s.hook.kicker)")
          gh release create "video-$ID" release/* --title "$title" --notes-file notes.md --latest=false
          echo "published: video-$ID" >> "$GITHUB_STEP_SUMMARY"

  # the clock (timer.yml): after every production, a timer run sleeps until the next video is due.
  # The schedule above is only the second line: it ran about once in four hours on 1-2 October.
  timer:
    needs: [gate, produce]
    if: always() && vars.MOTION_PRODUCE != 'off' && needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: gh workflow run timer.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"

  pages:
    needs: produce
    # after a new video, or when asked for directly; a run that published nothing changes nothing
    if: always() && vars.MOTION_PRODUCE != 'off' && (needs.produce.outputs.id != '' || inputs.pages_only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: The latest twenty videos
        run: |
          mkdir -p site/v
          for tag in $(gh release list --limit 20 --json tagName --jq '.[].tagName' | grep -E '^(video-evt_|digest-)'); do
            gh release download "$tag" --dir site/v --pattern '*.mp4' --pattern '*.jpg' --pattern '*.json' --clobber
          done
          # the studio stills, when the studio workflow has made them
          gh release download studio --pattern studio.tar --dir . --clobber 2>/dev/null && tar -C site -xf studio.tar || echo "no studio yet"
          node tools/scene/site.mjs site
          du -sh site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
