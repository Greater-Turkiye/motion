name: voice-sample

# One narrated video on request, the way production makes it (PLAN.md section 15.7): the scene's own
# words (tools/audio/narration.mjs), read by Chatterbox Multilingual (MIT, watermarked) on the CPU,
# the scene retimed so each block holds its clip (tools/audio/retime.mjs), placed on the rendered
# video (tools/audio/voice.mjs). The video and the clips are kept as an
# artifact for a week; nothing is published. For trying a scene, a voice or a change to the mixer.
on:
  workflow_dispatch:
    inputs:
      scene:
        description: "Scene id (scenes/ or scenes/auto/)"
        required: false
        default: karadeniz-gemi
      engine:
        description: "chatterbox (production) or freya (trial: FreyaTTS-small, pinned commit)"
        required: false
        default: chatterbox

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SCENE: ${{ inputs.scene }}
      ENGINE: ${{ inputs.engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: assets/emblems
          key: emblems-${{ hashFiles('assets/emblems/manifest.json') }}
      - run: npm ci
      - name: Emblems (pinned by hash in the manifest)
        run: python3 tools/data/fetch_emblems.py --sync
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: The voice model (CPU)
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          case "$ENGINE" in
            chatterbox) python -m pip install --quiet chatterbox-tts faster-whisper ;;
            freya)
              git clone --quiet https://github.com/freyavoiceai/FreyaTTS.git ../FreyaTTS
              git -C ../FreyaTTS checkout --quiet 146d36c1cb6660646be57d31339db4eed9315de3
              python -m pip install --quiet -r ../FreyaTTS/requirements.txt faster-whisper
              echo "PYTHONPATH=$(cd ../FreyaTTS && pwd)" >> "$GITHUB_ENV" ;;
            *) echo "unknown engine: $ENGINE"; exit 1 ;;
          esac
      - name: Narration
        run: |
          case "$SCENE" in *[!a-z0-9_-]*) echo "not a scene id: $SCENE"; exit 1 ;; esac
          node tools/audio/narration.mjs "$SCENE" out/narration.json
          python -u tools/audio/tts.py out/narration.json out/voice "$ENGINE"
          f="scenes/$SCENE.yaml"; [ -f "$f" ] || f="scenes/auto/$SCENE.yaml"
          node tools/audio/retime.mjs "$f" out/voice
          echo "voice: synthetic" >> "$f"
      - name: Video with the voice
        run: |
          node export/render.mjs --scene "$SCENE" --out out/video
          node tools/audio/voice.mjs out/voice out/video/*.mp4 "out/voice/$SCENE-$ENGINE.mp4"
          cp out/narration.json out/voice/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: voice-sample
          path: out/voice/
          retention-days: 7
