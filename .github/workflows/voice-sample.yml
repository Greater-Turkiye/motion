name: voice-sample

# A Turkish narration sample for the owner to judge (PLAN.md section 15, voice-over): Chatterbox
# Multilingual (MIT, watermarked) reads the karadeniz-gemi blocks on a runner, where there is memory
# to spare, and the clips are kept as an artifact. Nothing here reaches a published video.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Chatterbox (CPU)
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet chatterbox-tts
      - name: Read the blocks
        run: python -u tools/audio/tts_sample.py out/voice
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: voice-sample
          path: out/voice/
          retention-days: 7
