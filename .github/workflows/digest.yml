name: digest

# The week in each watch region, one video per region with at least 15 records (PLAN.md section 19):
# tools/scene/digest.mjs builds the scene from the last seven days, then it is narrated, rendered and
# published exactly as a single story is (produce.yml), as a release tagged digest-<region>-<date>.
# The produce workflow's gate counts only video-* releases, so a digest never delays the next story.
# Mondays, and on request. MOTION_PRODUCE=off stops it too.
on:
  schedule:
    - cron: "27 6 * * 1"
  workflow_dispatch:
    inputs:
      end:
        description: "Last day of the week, YYYY-MM-DD (default: today)"
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  region:
    if: vars.MOTION_PRODUCE != 'off'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        region: [black-sea, balkans, gulf-red-sea, levant, syria, iraq, iran, caucasus, aegean, east-med, cyprus]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      REGION: ${{ matrix.region }}
      END: ${{ inputs.end }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: assets/emblems
          key: emblems-${{ hashFiles('assets/emblems/manifest.json') }}
      # ffmpeg-static downloads its binary from GitHub's release storage, which answers 500 now and
      # then (twice on 2 October): three tries a minute apart before the run fails
      - run: for i in 1 2 3; do npm ci && exit 0; echo "npm ci failed ($i), retrying"; sleep 60; done; exit 1
      - name: Emblems (pinned by hash in the manifest)
        run: python3 tools/data/fetch_emblems.py --sync
      - name: Scene
        id: scene
        run: |
          git clone --quiet --depth 1 --branch auto-data https://github.com/Greater-Turkiye/datasets.git ../datasets
          end="${END:-$(date -u +%F)}"
          node tools/scene/digest.mjs --datasets ../datasets --region "$REGION" --end "$end" --meta meta.json --id-file id.txt
          if [ -f id.txt ]; then
            id=$(cat id.txt)
            if gh release view "$id" >/dev/null 2>&1; then echo "already published: $id"; else echo "id=$id" >> "$GITHUB_OUTPUT"; fi
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.scene.outputs.id != '' && vars.MOTION_VOICE != 'off'
        with:
          python-version: "3.11"
      - name: Narration
        id: voice
        if: steps.scene.outputs.id != '' && vars.MOTION_VOICE != 'off'
        continue-on-error: true
        timeout-minutes: 40
        env:
          ID: ${{ steps.scene.outputs.id }}
        run: |
          node tools/audio/narration.mjs "$ID" out/narration.json
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet chatterbox-tts faster-whisper
          python -u tools/audio/tts.py out/narration.json out/voice
          node tools/audio/retime.mjs "$ID" out/voice
          echo "voice: synthetic" >> "scenes/auto/$ID.yaml"
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Video, poster and carousel
        if: steps.scene.outputs.id != ''
        env:
          ID: ${{ steps.scene.outputs.id }}
          VOICE: ${{ steps.voice.outputs.ok }}
          MUSIC: ${{ vars.MOTION_MUSIC }}
        run: |
          node export/render.mjs --scene "$ID" --bitrate 8000000 --out out/video
          node export/render.mjs --no-build --scene "$ID" --frames-only --every 100000 --save-frames --out out/poster
          mkdir -p release
          if [ "$VOICE" = "true" ]; then voice=out/voice; else voice=-; fi
          kit=(--kit assets/sound/kit.json --scene "$ID"); [ "$MUSIC" = "off" ] && kit=()
          if [ "$voice" = "-" ] && [ ${#kit[@]} -eq 0 ]; then cp out/video/*.mp4 "release/$ID.mp4"
          else node tools/audio/voice.mjs "$voice" out/video/*.mp4 "release/$ID.mp4" "${kit[@]}"; fi
          cp out/poster/*-frames/0000.jpg "release/$ID.jpg"
          node tools/post/carousel.mjs "$ID" release --no-build
          cp meta.json "release/$ID.json"
          ls -la release
      - name: Publish
        if: steps.scene.outputs.id != ''
        env:
          ID: ${{ steps.scene.outputs.id }}
          VOICE: ${{ steps.voice.outputs.ok }}
        run: |
          case "$ID" in digest-[a-z-]*-20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;; *) echo "not a digest id: $ID"; exit 1 ;; esac
          title=$(node -e "console.log(JSON.parse(require('fs').readFileSync('meta.json','utf8')).title)")
          {
            echo "Haftalık özet, kimse yazmadan ve okumadan üretildi (tools/scene/digest.mjs)."
            echo "Sayılar Greater Türkiye'nin otomatik kayıtlarından; öne çıkan üç haber kaynakların kendi başlıkları."
            if [ "$VOICE" = "true" ]; then echo "Seslendirme: yapay ses (Chatterbox Multilingual, MIT; ekrandaki metnin aynısı)."; fi
          } > notes.md
          gh release create "$ID" release/* --title "$title" --notes-file notes.md --latest=false
          echo "published: $ID" >> "$GITHUB_STEP_SUMMARY"

  pages:
    needs: region
    if: always() && vars.MOTION_PRODUCE != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Republish the Pages site with the new digests
        run: gh workflow run produce.yml -R "$GITHUB_REPOSITORY" -f pages_only=true
